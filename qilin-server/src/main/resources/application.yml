server:
  port: 8080

spring:
  application:
    name: qilin-server
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2s

  datasource:
    url: jdbc:mysql://localhost:3306/qilin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
    
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
